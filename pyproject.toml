[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eeg-denoising-benchmark-utility"
version = "0.1.0"
description = "Controlled-capacity EEG denoising benchmark and downstream BCI utility analysis."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Jasmeet Singh Bindra"},
  {name = "Shubhajit Roy Chowdhury"},
  {name = "Siddharth Panwar"}
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "torch>=2.0",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
bci = [
  "mne>=1.6",
  "braindecode>=0.8",
]
dev = [
  "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]
